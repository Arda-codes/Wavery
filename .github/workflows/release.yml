name: Release Multi-Platform Builders

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Draft release instead of publishing'
        required: false
        type: boolean
        default: true

jobs:
  build-release:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'universal-apple-darwin'
            args: '--target universal-apple-darwin'
            os_name: 'macOS'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
            os_name: 'Linux'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
            os_name: 'Windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Frontend Dependencies
        working-directory: ui
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: ui
        run: npm run build

      - name: Build Desktop Application (Tauri Action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './ui'
          tagName: ${{ github.ref_name }}
          releaseName: 'Wavery v__VERSION__'
          releaseBody: 'See changelog for release details.'
          releaseDraft: ${{ github.event.inputs.release_draft || true }}
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Artifacts (Fallback if not tagged)
        if: startsWith(github.ref, 'refs/tags/v') != true
        uses: actions/upload-artifact@v4
        with:
          name: wavery-${{ matrix.os_name }}-${{ matrix.target }}
          path: |
            ui/src-tauri/target/release/bundle/
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: warn
