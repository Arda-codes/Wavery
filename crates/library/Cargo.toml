[package]
name = "wavery-library"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "File scanning, tag reading (lofty), and SQLite database for Wavery"

[dependencies]
wavery-core = { workspace = true }
rusqlite = { version = "0.33", features = ["bundled"] }
lofty = "0.21"
symphonia = { version = "0.5", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "flac", "isomp4", "mkv", "mp3", "pcm", "vorbis", "wav"] }
uuid = { workspace = true }
async-trait = { workspace = true }
walkdir = "2.5"
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
