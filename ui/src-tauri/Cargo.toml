[package]
name = "wavery-tauri"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tauri desktop shell commands for Wavery"

[dependencies]
wavery-core = { workspace = true }
wavery-config = { workspace = true }
wavery-audio = { workspace = true }
wavery-library = { workspace = true }
wavery-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
parking_lot = "0.12"
tauri = { version = "2.2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
rfd = "0.15"
base64 = "0.22"
tauri-build = { version = "2.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
wavery-mpris = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
