[package]
name = "wavery-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Local HTTP/WebSocket API and Range-request audio streaming server for browser playback"

[dependencies]
wavery-core = { workspace = true }
wavery-library = { workspace = true }
wavery-config = { workspace = true }

axum = { version = "0.8", features = ["ws", "tokio"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
uuid = { workspace = true }
