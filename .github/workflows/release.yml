name: Release Multi-Platform Builders

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Draft release instead of publishing'
        required: false
        type: boolean
        default: true

jobs:
  build-release:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'universal-apple-darwin'
            args: '--target universal-apple-darwin'
            os_name: 'macOS'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
            os_name: 'Linux'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
            os_name: 'Windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Frontend Dependencies
        working-directory: ui
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: ui
        run: npm run build

      - name: Build Desktop Application (Tauri Action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './ui'
          tagName: ${{ github.ref_name }}
          releaseName: 'Wavery ${{ github.ref_name }}'
          releaseBody: 'Wavery Alpha/Pre-Release Preview Build.'
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

      - name: Upload Artifacts (Fallback if not tagged)
        if: startsWith(github.ref, 'refs/tags/v') != true
        uses: actions/upload-artifact@v4
        with:
          name: wavery-${{ matrix.os_name }}-${{ matrix.target }}
          path: |
            ui/src-tauri/target/release/bundle/
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: warn

  build-arch:
    name: Package (Arch Linux)
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          pacman -Syu --noconfirm base-devel git github-cli binutils tar xz zstd
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          TAG="${{ github.ref_name }}"
          PKG_VER=$(echo "${TAG#v}" | tr '-' '_')
          
          cd packaging/arch
          sed -i "s/pkgver=.*/pkgver=${PKG_VER}/" PKGBUILD
          sed -i "s|\${TAG_NAME}|${TAG}|g" PKGBUILD
          
          chown -R builder:builder .
          su builder -c "makepkg -f --nodeps --noconfirm"

      - name: Upload Arch Package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config --global --add safe.directory "*"
          gh release upload ${{ github.ref_name }} packaging/arch/*.pkg.tar.zst --repo ${{ github.repository }} --clobber


